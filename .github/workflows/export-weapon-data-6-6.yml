name: Export 6.6 private deobfuscated equipment BinOutput

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize]

permissions:
  contents: write

jobs:
  export:
    if: github.head_ref == 'export-weapon-data-6-6'
    runs-on: ubuntu-latest
    steps:
      - name: Package private deobfuscated BinOutput
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git clone -q --branch export-weapon-data-6-6 --depth 1 --filter=blob:none --sparse "https://x-access-token:${GH_TOKEN}@github.com/IKunPS/Resources.git" /tmp/resources
          cd /tmp/resources
          git sparse-checkout set --no-cone /BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Bow2.json /BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Catalyst2.json /BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Claymore2.json /BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Pole2.json /BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Sword2.json /BinOutput/Talent/EquipTalents/ConfigAffix_Bow.json /BinOutput/Talent/EquipTalents/ConfigAffix_Catalyst.json /BinOutput/Talent/EquipTalents/ConfigAffix_Claymore.json /BinOutput/Talent/EquipTalents/ConfigAffix_Pole.json /BinOutput/Talent/EquipTalents/ConfigAffix_Sword.json
          tar -czf /tmp/gio-private-binout-6-6.tar.gz BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Bow2.json BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Catalyst2.json BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Claymore2.json BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Pole2.json BinOutput/Ability/Temp/EquipAbilities/ConfigAbility_Weapon_Sword2.json BinOutput/Talent/EquipTalents/ConfigAffix_Bow.json BinOutput/Talent/EquipTalents/ConfigAffix_Catalyst.json BinOutput/Talent/EquipTalents/ConfigAffix_Claymore.json BinOutput/Talent/EquipTalents/ConfigAffix_Pole.json BinOutput/Talent/EquipTalents/ConfigAffix_Sword.json
          sha256sum /tmp/gio-private-binout-6-6.tar.gz | awk '{print $1}' > /tmp/sha256.txt
          wc -c /tmp/gio-private-binout-6-6.tar.gz | awk '{print $1}' > /tmp/size.txt

      - name: Publish unique temporary private release asset and capture signed URL
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          TAG="gio-weapon66-temp-${GITHUB_RUN_ID}"
          gh release create "$TAG" /tmp/gio-private-binout-6-6.tar.gz --repo IKunPS/Resources --title "Temporary GIO 6.6 export ${GITHUB_RUN_ID}" --notes 'Temporary private export; do not use directly.' >/dev/null
          ASSET_ID=$(gh api "repos/IKunPS/Resources/releases/tags/$TAG" --jq '.assets[] | select(.name=="gio-private-binout-6-6.tar.gz") | .id')
          SIGNED_URL=$(curl -sS -L -o /dev/null -w '%{url_effective}' -H "Authorization: Bearer ${GH_TOKEN}" -H 'Accept: application/octet-stream' "https://api.github.com/repos/IKunPS/Resources/releases/assets/${ASSET_ID}")
          cd /tmp/resources
          mkdir -p export/weapon66
          printf '%s\n' "$SIGNED_URL" > export/weapon66/signed_url.txt
          printf '%s\n' "$TAG" > export/weapon66/release_tag.txt
          cp /tmp/sha256.txt export/weapon66/sha256.txt
          cp /tmp/size.txt export/weapon66/size.txt
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add --sparse export/weapon66/signed_url.txt export/weapon66/release_tag.txt export/weapon66/sha256.txt export/weapon66/size.txt
          git commit -m 'build: publish stable temporary signed export URL'
          git push origin HEAD:export-weapon-data-6-6
